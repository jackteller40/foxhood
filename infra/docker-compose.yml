services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: foxhood
      POSTGRES_PASSWORD: foxhood   # local development only
      POSTGRES_DB: foxhood
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foxhood"]
      interval: 5s
      retries: 10

volumes:
  pgdata: