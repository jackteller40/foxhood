[project]
name = "foxhood-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "exchange-calendars>=4.5",
    "fastapi>=0.162.0",
    "finnhub-python>=2.4",
    "langchain>=1.0",
    "langchain-anthropic>=1.0",
    "langchain-mcp-adapters>=0.2",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "langsmith>=0.4",
    "mcp>=1.9",
    "pandas>=2.2",
    "plotly>=5.24",
    "psycopg[binary]>=3.3.8",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "requests>=2.32",
    "streamlit>=1.40",
    "tzdata>=2024.1",
    "uvicorn[standard]>=0.54.0",
    "yfinance>=0.2.50",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]   # pyflakes + import order + bugbear (real-bug patterns)

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]