name: Nightly backup
on:
  schedule:
    - cron: "15 7 * * *"   # 07:15 UTC = 2:15 or 3:15 a.m. Eastern
  workflow_dispatch: {}      # "Run workflow" button for a backup on demand

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_BACKUP_SA }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT }}
      - name: Install pg_dump (Postgres 16, same as Neon)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16
      - name: Dump and upload
        run: |
          set -euo pipefail
          URL="$(gcloud secrets versions access latest --secret=database-url)"
          echo "::add-mask::$URL"
          FILE="foxhood-$(date -u +%Y%m%d-%H%M).dump"
          /usr/lib/postgresql/16/bin/pg_dump --format=custom --no-owner --no-privileges --file "$FILE" "$URL"
          gcloud storage cp "$FILE" "${{ vars.GCP_BACKUP_BUCKET }}/$FILE"
          echo "Backed up $FILE ($(du -h "$FILE" | cut -f1))"
          rm -f "$FILE"
